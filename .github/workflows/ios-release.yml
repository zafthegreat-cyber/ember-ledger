name: iOS TestFlight build
# Archives the iPhone app on a GitHub Mac, signs it with Apple-managed (cloud) signing and
# uploads it to App Store Connect, where it appears in TestFlight after Apple processes it.
# Runs only when started from the Actions tab.
# Needs repository secrets: CODE3_APPLE_TEAM_ID (10-character team ID), CODE3_ASC_KEY_ID,
# CODE3_ASC_ISSUER_ID and CODE3_ASC_PRIVATE_KEY (the full text of the .p8 App Store Connect
# API key; the key needs the Admin role so Apple can create the distribution certificate).
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: New build number (above every build App Store Connect has received)
        type: string
        required: true
      version_name:
        description: Version shown to users
        type: string
        default: '1.0.0'
        required: true
permissions:
  contents: read
concurrency:
  group: ios-release
  cancel-in-progress: false
jobs:
  ios-release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CODE3_BUILD_NUMBER: ${{ inputs.build_number }}
      CODE3_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/native-build-number.mjs
      - name: Check version name
        run: |
          if ! [[ "$CODE3_VERSION_NAME" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){1,2}$ ]]; then echo "::error::Version must look like 1.0.0"; exit 1; fi
      - run: npm ci
      - run: npm run test:native
      - run: node scripts/test-native-build-readiness.mjs
      - run: npm run native:build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_VERIFIED_PROVIDERS: ${{ vars.VITE_AUTH_VERIFIED_PROVIDERS }}
          VITE_AUTH_ACCOUNT_LINKING_VERIFIED: ${{ vars.VITE_AUTH_ACCOUNT_LINKING_VERIFIED }}
      - run: npx cap sync ios
      - name: Restore App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.CODE3_ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.CODE3_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CODE3_ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.CODE3_APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then echo "::error::Add the four iOS repository secrets first."; exit 1; fi
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then echo "::error::CODE3_APPLE_TEAM_ID must be the 10-character team ID."; exit 1; fi
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/code3-asc.p8"
          chmod 600 "$RUNNER_TEMP/code3-asc.p8"
      - name: Archive and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.CODE3_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CODE3_ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.CODE3_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/code3-ios"
          mkdir -p "$OUT"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/code3-asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$OUT/Code3TCG.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$CODE3_BUILD_NUMBER" MARKETING_VERSION="$CODE3_VERSION_NAME" \
            "${AUTH[@]}" archive
          cat > "$OUT/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$OUT/Code3TCG.xcarchive" -exportPath "$OUT/export" \
            -exportOptionsPlist "$OUT/ExportOptions.plist" "${AUTH[@]}"
          mkdir -p artifacts/native/ios-release
          cp artifacts/native/web-build.json artifacts/native/ios-release/web-build.json
          echo "Build $CODE3_BUILD_NUMBER ($CODE3_VERSION_NAME) uploaded to App Store Connect from $GITHUB_SHA." > artifacts/native/ios-release/UPLOADED.txt
      - name: Remove App Store Connect key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/code3-asc.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code3-ios-testflight-build-${{ inputs.build_number }}
          path: artifacts/native/ios-release/
          retention-days: 14
