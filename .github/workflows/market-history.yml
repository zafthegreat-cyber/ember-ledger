name: Market price history (popular daily, all weekly)

# Owner, Nov 17 2026: "the over 2 year market pull", then "pull popular
# products daily and the rest weekly".
# scripts/build-market-history.mjs reads TCGCSV's daily TCGplayer price
# archives and commits per-set JSON files to the `market-history` data branch:
#   - every Pokémon product weekly, back to 2024-02-08
#   - popular products (newest sets, highest value, biggest movers) daily, last 120 days
# Runs every day; a weekly point is only added when its week is due. Supabase
# loads the files on its own schedule (public.market_history_* functions).
# Archives are immutable and cached; TCGCSV rate limits are waited out, and a
# run that is still limited keeps its progress for the next run.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Only add this many weekly points this run (blank = all; use 2 for a quick test, not committed)
        type: string
        default: ''
  schedule:
    # Daily 21:30 UTC, after TCGCSV writes the day's archive (~20:00 UTC).
    - cron: "30 21 * * *"

permissions:
  contents: write

concurrency:
  group: market-history
  cancel-in-progress: false

jobs:
  build-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 7-Zip
        run: command -v 7z || (sudo apt-get update && sudo apt-get install -y p7zip-full)
      - name: Restore downloaded archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .market-cache
          key: tcgcsv-archives-${{ github.run_id }}
          restore-keys: tcgcsv-archives-
      - name: Check out the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin market-history > /dev/null; then
            git fetch --depth 1 origin market-history
            git worktree add history-branch FETCH_HEAD
            git -C history-branch checkout -B market-history
          else
            git worktree add --orphan -b market-history history-branch
          fi
      - name: Build price history
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--cache .market-cache --out history-branch"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          node scripts/build-market-history.mjs $ARGS
          rm -rf .market-cache/extract
          du -sh history-branch --exclude=.git
      - name: Save downloaded archives
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .market-cache
          key: tcgcsv-archives-${{ github.run_id }}
      - name: Commit to the market-history branch
        # A quick test run (limit set) is never committed, so the full history is built later.
        if: inputs.limit == '' || github.event_name == 'schedule'
        run: |
          cd history-branch
          printf '%s\n' "# Market price history (data only)" "" "Pokémon TCGplayer market prices from TCGCSV archives, built by .github/workflows/market-history.yml on main." "Weekly for every product in the root folder; daily for popular products in daily/." "One file per set: { groupId, dates, series: { \"productId|subType\": [cents|null] } }." > README.md
          git add -A
          if git diff --cached --quiet; then echo "No new prices."; exit 0; fi
          git commit -q -m "Market history: weekly through $(node -e "const i=require('./index.json');console.log(i.dates.at(-1))"), daily through $(node -e "try{const i=require('./daily/index.json');console.log(i.dates.at(-1))}catch{console.log('none')}")"
          git push origin market-history
