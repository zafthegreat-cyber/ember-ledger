<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="__BRAND_ACCENT__" />
    <title>__BRAND_NAME__ — Offline</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      :root {
        color: #222222;
        background: #fbf4e6;
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: #fbf4e6;
      }

      main {
        width: min(460px, 100%);
        padding: 22px;
        border: 1px solid #dcd0c8;
        border-radius: 18px;
        background: #fffcf7;
        box-shadow: 0 5px 22px rgb(69 27 43 / 5%);
      }

      img {
        width: 82px;
        height: 82px;
        margin-bottom: 10px;
        object-fit: contain;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }

      p {
        margin: 0 0 14px;
        color: #675852;
        line-height: 1.45;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 10px;
        background: __BRAND_ACCENT__;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible { outline: 3px solid #4b1b6b; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="__BRAND_LOGO__" alt="__BRAND_ACCESSIBLE_LOGO_TEXT__" />
      <h1>__BRAND_NAME__ is offline</h1>
      <p>This page could not be loaded from the network. Reconnect and try again. Records saved in this browser should still be available when the app opens.</p>
      <a href="/">Try opening __BRAND_NAME__</a>
    </main>
  </body>
</html>
