<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="__BRAND_ACCENT__" />
    <meta name="background-color" content="#f6f3ed" />
    <meta name="description" content="__BRAND_TAGLINE__" />
    <meta name="application-name" content="__BRAND_NAME__" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="__BRAND_SHORT_NAME__" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="__BRAND_FAVICON__" />
    <link rel="icon" href="__BRAND_FAVICON__" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>__BRAND_NAME__</title>
    <style>
      html,
      body {
        background: #f6f3ed;
      }

      .app-load-fallback {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #202521;
        background: #f6f3ed;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      .app-load-fallback-card {
        width: min(460px, 100%);
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 28px;
        border: 1px solid #dedfd9;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(24, 31, 27, 0.12);
      }

      .app-load-fallback-brand {
        width: 74px;
        height: 74px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: __BRAND_ACCENT__;
        color: #ffffff;
        font-weight: 950;
        font-size: 1.45rem;
        box-shadow: none;
      }

      .app-load-fallback-eyebrow {
        margin: 0;
        color: __BRAND_ACCENT__;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .app-load-fallback h1 {
        margin: 0;
        color: #202521;
        font-size: clamp(1.75rem, 8vw, 2.85rem);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .app-load-fallback p,
      .app-load-fallback small {
        margin: 0;
        color: #4f5952;
      }

      .app-load-fallback p {
        font-size: 1rem;
      }

      .app-load-fallback small {
        max-width: 32rem;
        font-size: 0.9rem;
      }

      .app-load-fallback-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 4px;
      }

      .app-load-fallback button,
      .app-load-fallback a {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        background: __BRAND_ACCENT__;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
      }

      .app-load-fallback a.app-load-fallback-secondary {
        color: #202521;
        background: #ffffff;
        border: 1px solid #b8beb7;
      }

      @media (max-width: 520px) {
        .app-load-fallback {
          padding: 16px;
        }

        .app-load-fallback-card {
          padding: 22px;
          border-radius: 18px;
        }

        .app-load-fallback-actions,
        .app-load-fallback button,
        .app-load-fallback a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-load-fallback" aria-label="Loading __BRAND_NAME__">
        <div class="app-load-fallback-card">
          <div class="app-load-fallback-brand" aria-hidden="true">__BRAND_MONOGRAM__</div>
          <p class="app-load-fallback-eyebrow">__BRAND_NAME__</p>
          <h1>Loading __BRAND_SHORT_NAME__...</h1>
          <p>Preparing your business workspace.</p>
          <small>If this takes more than a few seconds, refresh the page.</small>
          <div class="app-load-fallback-actions">
            <button type="button" onclick="window.location.reload()">Refresh app</button>
            <a class="app-load-fallback-secondary" href="/">Go to homepage</a>
          </div>
        </div>
      </div>
      <noscript>
        <style>
          #root > .app-load-fallback:not(.app-load-fallback-noscript) {
            display: none;
          }
        </style>
        <div class="app-load-fallback app-load-fallback-noscript" aria-label="__BRAND_NAME__ needs JavaScript">
          <div class="app-load-fallback-card">
            <div class="app-load-fallback-brand" aria-hidden="true">__BRAND_MONOGRAM__</div>
            <p class="app-load-fallback-eyebrow">__BRAND_NAME__</p>
            <h1>__BRAND_NAME__ needs JavaScript</h1>
            <p>Please enable JavaScript, then refresh the app.</p>
          </div>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
